<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenithInvest - Inscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Barre de navigation -->
    <header>
        <div class="logo">🚀 ZenithInvest</div>
        <nav>
            <ul>
                <li><a href="index.html">🏠 Accueil</a></li>
                <li><a href="projects.html">💼 Projets</a></li>
                <li><a href="login.html" class="btn-login">🔐 Connexion</a></li>
                <li><a href="register.html" class="active btn-register">📝 Inscription</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenu principal : Inscription -->
    <main class="container">
        <div class="section-box" style="max-width: 400px; margin: 5rem auto; text-align: center;">
            <h2>📝 Créer un compte</h2>
            <p>Rejoignez ZenithInvest et commencez à investir dès aujourd'hui.</p>
            
            <form style="text-align: left; margin-top: 2rem;">
                <div style="margin-bottom: 1rem;">
                    <label><strong>Nom complet :</strong></label><br>
                    <input type="text" placeholder="Ex: Leo Houetognon" required style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label><strong>Email :</strong></label><br>
                    <input type="email" placeholder="votre@email.com" required style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label><strong>Mot de passe :</strong></label><br>
                    <input type="password" placeholder="********" required style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Créer mon compte</button>
            </form>
            <p style="margin-top: 1rem;">Déjà un compte ? <a href="login.html">Se connecter</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ZenithInvest. Tous droits réservés.</p>
    </footer>

</body>
</html>
